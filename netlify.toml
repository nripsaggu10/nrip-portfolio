[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

# Keep existing résumé links working after switching to the supplied PDF.
[[redirects]]
  from = "/resume"
  to = "/nripdev-singh-resume.pdf"
  status = 301

[[redirects]]
  from = "/resume/"
  to = "/nripdev-singh-resume.pdf"
  status = 301

[[redirects]]
  from = "/resume.html"
  to = "/nripdev-singh-resume.pdf"
  status = 301
